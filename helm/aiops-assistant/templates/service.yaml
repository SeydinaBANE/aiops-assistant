apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-assistant.fullname" . }}
  labels: {{ include "aiops-assistant.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.config.apiPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "aiops-assistant.name" . }}
